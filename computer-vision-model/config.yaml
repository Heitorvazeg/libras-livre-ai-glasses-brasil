# Configuração central da trilha de IA.
# Um único lugar para vocabulário, caminhos e hiperparâmetros (ver guia Parte 1).

# Vocabulário de palavras/sinais isolados. A ordem define o índice de classe
# que o .tflite devolve e que o app mapeia de volta para texto.
#
# Mesma lista da PoC (PoC/config.yaml) e da seleção de vídeos públicos em
# datasets/selecao.yaml: são os 10 sinais que existem tanto na MINDS-Libras
# quanto na V-LIBRASIL, ou seja, os que chegam com 11 pessoas diferentes cada.
vocabulario:
  - acontecer
  - amarelo
  - banheiro
  - barulho
  - espelho
  - filho
  - maca        # maçã (a fruta)
  - medo
  - ruim
  - sapo

paths:
  raw_videos: data/raw
  landmarks: data/landmarks
  models: models
  tflite_out: models/sinal_classifier.tflite

landmarks:
  # ATENÇÃO: parte dos 10 sinais do vocabulário é articulada com as DUAS mãos
  # (ex.: barulho, espelho). Este pipeline ainda está em 1 mão porque
  # src/data/landmark_extraction.py concatena as mãos detectadas num vetor de
  # tamanho variável — com max_num_hands: 2 os frames saem com 63 ou 126 valores
  # conforme a detecção. Corrigir lá (posição fixa por mão, zeros na ausente,
  # como a PoC já faz) ANTES de subir este número.
  max_num_hands: 1        # 1 mão -> 21 pontos x (x,y,z) = 63 valores
  num_pontos_por_mao: 21
  dims: 3                 # x, y, z

# Fase A (raso) ou Fase B (temporal). Ver §1.3.
fase: A

treino:
  epochs: 30
  batch_size: 16
  learning_rate: 0.001
  val_split: 0.2
  seed: 42

export:
  quantizar: false        # ligar a partir da Fase B (§1.4)
