# Seleção de sinais das bases públicas de Libras usadas pela PoC e pelo treino.
#
# HISTÓRICO DO CRITÉRIO
#
# Até 2026-09-08 esta lista tinha 10 sinais: os que existem NAS DUAS bases, para
# maximizar pessoas por sinal (8 MINDS + 3 V-LIBRASIL = 11) na PoC de DTW.
#
# Agora ela tem os 20 sinais do MINDS-Libras. Motivo (docs/investigacao-expansao-dataset.md):
# a etapa de treino usa o MINDS como núcleo — fonte única, sem o degrau entre bases
# que custou ~15 pontos na PoC, e sem rótulo ambíguo. Os 10 sinais que também
# existem na V-LIBRASIL mantêm o mapeamento: ela some 3 pessoas a mais neles, e
# serve como teste de domínio diferente (treina no MINDS, testa na V-LIBRASIL).
#
# Os 10 sinais adicionados são MINDS-only: não têm chave `vlibrasil`, e por isso
# ingest.py simplesmente não os procura naquele bundle.
#
# Esta lista é a fonte de verdade da ingestão. O vocabulário em ../PoC/config.yaml
# e ../config.yaml precisa conter exatamente estes 20 rótulos — ingest.py confere
# e avisa se divergirem.

destino: ../PoC/data/raw

fontes:
  minds:
    kaggle: j0aopsantos/minds-libras
    # 20 sinais × 8 sinalizadores × 5 repetições = 800 clipes (~48 GB no bundle).
    # Nome do arquivo: "01AcontecerSinalizador05-3.mp4" -> sinal, pessoa 05, rep 3.
    prefixo_pessoa: M
  vlibrasil:
    kaggle: davimedio01/v-librasil
    # 1.364 sinais × 3 articuladores × 1 execução = 4.088 clipes (~11 GB).
    # Nome do arquivo: "videos UFPE (V-LIBRASIL)/data/Ruim_Articulador2.mp4".
    prefixo_pessoa: V

sinais:
  # validado: true  -> não há ambiguidade de rótulo: ou o rótulo é o mesmo nas duas
  #                    bases, ou o sinal vem só do MINDS (sem merge, sem ambiguidade)
  # validado: false -> rótulos diferentes entre as bases, pareados por julgamento;
  #                    precisa de conferência de consultor de Libras (README §3)
  - sinal: acontecer
    minds: Acontecer
    vlibrasil: Acontecer
    validado: true
  - sinal: amarelo
    minds: Amarelo
    vlibrasil: Amarelo
    validado: true
  - sinal: banheiro
    minds: Banheiro
    vlibrasil: Banheiro
    validado: true
  - sinal: barulho
    minds: Barulho
    vlibrasil: Barulho
    validado: true
  - sinal: espelho
    minds: Espelho
    vlibrasil: Espelho
    validado: true
  - sinal: filho
    minds: Filho
    vlibrasil: Filho
    validado: true
  - sinal: ruim
    minds: Ruim
    vlibrasil: Ruim
    validado: true
  - sinal: maca            # maçã (a fruta)
    minds: Maca
    vlibrasil: "Maçã (rosto)"
    validado: false
    nota: >-
      A V-LIBRASIL registra a variante articulada no rosto; a MINDS não
      especifica a variante no rótulo. Conferir se são a mesma antes de tratar
      os clipes das duas bases como a mesma classe.
  - sinal: medo
    minds: Medo
    vlibrasil: Com medo
    validado: false
    nota: >-
      "Medo" (MINDS) e "Com medo" (V-LIBRASIL) são rótulos diferentes para o que
      parece ser o mesmo sinal. Conferir com consultor de Libras.
  - sinal: sapo
    minds: Sapo
    vlibrasil: Rã (sapo)
    validado: false
    nota: >-
      A V-LIBRASIL usa "Rã (sapo)". Rã e sapo podem ter sinais distintos
      dependendo da variante regional. Conferir antes de usar as duas juntas.

  # --- MINDS-only (adicionados em 2026-09-08) ---------------------------------
  # Os 10 sinais restantes do MINDS-Libras. Sem chave `vlibrasil`: entram como
  # fonte única, que é justamente o ponto — sem merge, sem rótulo ambíguo.
  - sinal: aluno
    minds: Aluno
    validado: true
  - sinal: america
    minds: America
    validado: true
  - sinal: aproveitar
    minds: Aproveitar
    validado: true
  - sinal: bala
    minds: Bala
    validado: true
  - sinal: banco
    minds: Banco
    validado: true
  - sinal: cinco
    minds: Cinco
    validado: true
  - sinal: conhecer
    minds: Conhecer
    validado: true
  - sinal: esquina
    minds: Esquina
    validado: true
  - sinal: vacina
    minds: Vacina
    validado: true
  - sinal: vontade
    minds: Vontade
    validado: true
