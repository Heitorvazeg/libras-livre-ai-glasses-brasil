# Sequências de glosas — a "receita" do corpus (Rota B, §5.1.2)
#
# Mesmo papel de ../../computer-vision-model/datasets/selecao.yaml: escrito à
# mão, versionado, e é daqui que o corpus inteiro é derivado.
#
# REGRA DURA: toda glosa usada aqui existe em lexico/lexico-glosas.json.
# corpus/gerar.py valida e falha se alguma escapar.
#
# PENDENTE DE REVISÃO: estas sequências são a hipótese de um modelo de linguagem
# sobre o que alguém sinalizaria num balcão — NÃO são enunciados observados.
# §5.1.2, ressalva 2: é este arquivo que precisa passar pelo consultor /
# Associação de Surdos de Goiânia antes de valer alguma coisa.
#
# DEPENDE DE VOCABULÁRIO NÃO VERIFICADO: usa os 7 sinais funcionais marcados
# `camada: 3-proposta` no léxico (eu, você, querer, precisar, onde, quanto,
# quando). Eles ainda não foram cruzados com as bases públicas. Enquanto isso
# não acontecer, as sequências que dependem deles treinam um mapeamento que o
# SignClassifier ainda não consegue alimentar — gerar.py marca cada par com
# `depende_c3` para que dê para treinar/avaliar com e sem elas.

meta:
  versao: 0.2.0-rascunho
  vocabulario: Camadas 1+2 (34) + 7 funcionais propostos = 41 glosas
  parafrases_por_sequencia: 8

