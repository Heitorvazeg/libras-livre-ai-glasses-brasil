<!doctype html>
<!--
  Libras Livre — cola entre o player oficial do VLibras e o AvatarPlayer.kt.

  Este arquivo É versionado; vlibras.js e target/* NÃO são (13,5 MB, baixados por
  ../../../../download-assets.sh — ver assets/.gitignore).

  Usa o wrapper oficial (VLibras.Player) de propósito: dirigir o Unity direto por
  SendMessage funciona, mas o Unity chama de volta globais de JS que só o wrapper define
  (CounterGloss, onPlayingStateChange). Sem elas o evento gloss:end some — e ele é o sinal
  de que o estado ⑦ terminou. Medido em 2026-09-12, docs/vlibras-webview-plano.md §0.7.
-->
<html lang="pt-BR">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Avatar Libras</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  #wrapper,#gameContainer,canvas{width:100%!important;height:100%!important;display:block}
</style>
</head>
<body>
<div id="wrapper"></div>
<script src="vlibras.js"></script>
<script>
(function () {
  // Chamar um método @JavascriptInterface de 0 args COM um argumento (undefined) lança
  // "method not found" em WebViews recentes (Chromium 151+), e o onReady/onGlossEnd sumiam
  // calados — o app esperava PRONTO até o timeout mesmo com o player já carregado. Só passa
  // arg quando ele existe; e o erro, se houver, vai para o console (capturado no logcat).
  function bridge(fn, arg) {
    try { if (arg === undefined) AvatarBridge[fn](); else AvatarBridge[fn](arg); }
    catch (e) { console.error("bridge " + fn + " falhou: " + e); }
  }

  if (typeof VLibras === "undefined") {
    bridge("onError", "vlibras.js ausente — rode ./download-assets.sh");
    return;
  }

  // Sem WebGL o Unity não tem como desenhar. Falhar aqui, explicitamente, é melhor que
  // uma tela branca: o AvatarPlayer cai para o fallback (falar + legenda).
  var c = document.createElement("canvas");
  if (!(c.getContext("webgl2") || c.getContext("webgl"))) {
    bridge("onError", "sem WebGL nesta WebView");
    return;
  }

  var player = new VLibras.Player({
    targetPath: "target",
    // translator NÃO é usado: quem traduz é o VLibrasGlosaTranslator.kt, porque o config.js
    // do player aponta para uma URL morta (§0.1 do plano). Só chamamos player.play(glosa).
    onLoad: function () {}
  });

  player.on("load", function () {
    // O dicionário de sinais é buscado na rede pelo Unity a cada sinal (§0.3 do plano):
    // https://dicionario2.vlibras.gov.br/2018.3.1/WEBGL/BR/<SINAL>.bundle
    //
    // O espelho local (Fase 3.5) NÃO se resolve daqui: Player não expõe setBaseUrl, e o
    // play() reescreve a base a cada chamada a partir do config do bundle — qualquer URL que
    // puséssemos duraria um sinal. O caminho é o shouldInterceptRequest que o AvatarPlayer.kt
    // já tem: servir dicionario2.vlibras.gov.br de assets/vlibras/dic/ quando o arquivo existir.
    bridge("log", "player carregado");
    bridge("onReady");
  });

  player.on("gloss:end", function () { bridge("onGlossEnd"); });
  player.on("error", function (e) { bridge("onError", String(e)); });

  player.load(document.getElementById("wrapper"));

  // Superfície que o AvatarPlayer.kt chama por evaluateJavascript.
  window.avatarPlay = function (glosa) {
    bridge("log", "play: " + glosa);
    player.play(glosa);
  };
  window.avatarStop = function () { player.stop(); };

  // A WebView carrega ESCONDIDA e sem tamanho (0x0) durante o aquecimento; o Unity fixa o buffer
  // de desenho no tamanho de init e não redesenha sozinho quando a view é anexada e ganha
  // dimensão real — daí a tela branca. Um ResizeObserver reavisa o Unity (evento 'resize', que o
  // UnityLoader escuta) assim que o container finalmente tem tamanho, e loga para diagnóstico.
  var wrapper = document.getElementById("wrapper");
  // Carregada escondida (0x0), a página trava o `height:100%` em 0 e, ao anexar, só a largura se
  // recupera — a altura fica 0 e o Unity desenha em 0x0 (tela branca). Em vez de confiar no
  // viewport, o Kotlin passa a altura/largura reais em px do dispositivo; fixamos html/body nesse
  // tamanho (em px CSS) e o `height:100%!important` do wrapper/canvas cascateia, e o Unity então
  // recalcula o buffer no evento 'resize'.
  window.avatarResize = function (pxW, pxH) {
    var dpr = window.devicePixelRatio || 1;
    if (pxH > 0) {
      var cssH = Math.round(pxH / dpr) + "px";
      document.documentElement.style.height = cssH;
      document.body.style.height = cssH;
    }
    if (pxW > 0) {
      var cssW = Math.round(pxW / dpr) + "px";
      document.documentElement.style.width = cssW;
      document.body.style.width = cssW;
    }
    var cv = wrapper.querySelector("canvas");
    bridge("log", "resize in=" + pxW + "x" + pxH + " dpr=" + dpr +
        " wrapper=" + wrapper.clientWidth + "x" + wrapper.clientHeight +
        " canvas=" + (cv ? cv.width + "x" + cv.height : "-"));
    if (wrapper.clientWidth > 0 && wrapper.clientHeight > 0) window.dispatchEvent(new Event("resize"));
  };
  if (window.ResizeObserver) new ResizeObserver(function () { window.avatarResize(); }).observe(wrapper);
})();
</script>
</body>
</html>
