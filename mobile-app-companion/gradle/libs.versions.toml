[versions]
agp = "8.11.1"
kotlin = "2.2.21"
activityCompose = "1.13.0"
composeBom = "2026.05.01"
mwdat = "0.9.0"
lifecycle = "2.10.0"
kotlinxCollectionsImmutable = "0.4.0"
uiAutomator = "2.3.0"
testRules = "1.7.0"
uiJunit4 = "1.11.2"
exifInterface = "1.4.2"
mediapipeTasksVision = "0.10.14"
junit = "4.13.2"
onnxRuntimeAndroid = "1.22.0"
voskAndroid = "0.3.75"
jna = "5.18.1"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
mwdat-core = { group = "com.meta.wearable", name = "mwdat-core", version.ref = "mwdat" }
mwdat-camera = { group = "com.meta.wearable", name = "mwdat-camera", version.ref = "mwdat" }
mwdat-mockdevice = { group = "com.meta.wearable", name = "mwdat-mockdevice", version.ref = "mwdat" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiAutomator" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "testRules" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "uiJunit4" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifInterface" }
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasksVision" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Motor real de wake word (docs/orquestracao-dialogo-audio-plano.md §4 item 9) — usado por
# OpenWakeWordDetector.kt via com.rementia.openwakeword.lib (vendorizado, não é dependência Maven).
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxRuntimeAndroid" }
# vosk-android e jna (motor real de STT, §4 item 11) NÃO entram aqui: os dois publicam como .aar
# com classifier "@aar" (ex. "com.alphacephei:vosk-android:0.3.75@aar"), que o schema padrão do
# catálogo de versões não representa — declarados como string literal direto em
# app/build.gradle.kts, interpolando voskAndroid/jna deste bloco [versions].

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
